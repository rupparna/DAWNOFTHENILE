<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dawn of the Nile</title>
        <link rel="stylesheet" href="css/style.css">
        </head>
        <body>

            <section id="home">

                <div id="background"></div>

                <div id="sand"></div>
        <div id="eyes">
    <img src="assets/images/objects/egyptian_eyes_cropped.png"
         alt="Egyptian Eyes"
         id="egyptian-eyes">
</div>
        <div id="objects">
            <div class="object" id="scarab"></div>

            <div class="object" id="torch"></div>

             <div class="object" id="scroll"></div>

        </div>

<div id="title">
    <h1>Dawn of the Nile</h1>
    <p>Live the stories of Ancient Egypt</p>
</div>

<button id="start-btn">
    Start a Life
</button>
            </section>

            <section id="roles">
                <h2>Choose Your Life</h2>
                <div class="role-container">
                    
                    <div class="role-card" id="doctor">
                        <h3>Physician</h3>
                        <p>Heal the people of Ancient Egypt</p>

                    </div>

                     <div class="role-card" id="farmer">
            <h3>Farmer</h3>
            <p>Protect the harvest of the Nile</p>
        </div>

                <div class="role-card" id="scribe">
            <h3>Scribe</h3>
            <p>Record history and knowledge</p>
        </div>

        <div class="role-card" id="architect">
            <h3>Architect</h3>
            <p>Build monuments for eternity</p>
        </div>

    </div>

            </section>
            <script src="js/script.js"></script>
        

        
        </body>
</html>
